<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Бесконечный Тренажер — Охранные Системы</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b0f19;
            color: #f1f5f9;
        }
        .custom-glass {
            background: rgba(17, 24, 39, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .option-card {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .option-card:hover:not(:disabled) {
            transform: translateY(-2px);
            border-color: #3b82f6;
            background-color: rgba(30, 41, 59, 0.9);
        }
        .btn-glow {
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.4);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-blue-500 selection:text-white">

    <!-- Top Navigation Header -->
    <header class="custom-glass sticky top-0 z-50 border-b border-slate-800/80 px-4 py-3">
        <div class="max-w-4xl mx-auto flex flex-wrap justify-between items-center gap-3">
            <div class="flex items-center space-x-3">
                <div class="p-2.5 bg-gradient-to-tr from-blue-600 to-indigo-600 rounded-xl text-white font-black text-xl shadow-lg">
                    <i class="fas fa-infinity animate-spin" style="animation-duration: 12s;"></i>
                </div>
                <div>
                    <h1 class="font-bold text-base md:text-lg leading-tight text-white flex items-center gap-2">
                        Бесконечный Тренажер
                        <span class="text-[10px] px-2 py-0.5 rounded-full bg-blue-500/20 text-blue-400 font-semibold border border-blue-500/30">ALL TOPICS</span>
                    </h1>
                    <p class="text-xs text-slate-400">Полное погружение в конспект «Охранные системы»</p>
                </div>
            </div>

            <!-- Global Live Statistics -->
            <div class="flex items-center gap-2 text-xs">
                <div class="flex items-center space-x-1.5 bg-slate-900/90 px-3 py-1.5 rounded-lg border border-slate-800">
                    <i class="fas fa-check-circle text-emerald-400"></i>
                    <span class="text-slate-400">Верно:</span>
                    <span id="stat-correct" class="font-bold text-emerald-400">0</span>
                </div>
                <div class="flex items-center space-x-1.5 bg-slate-900/90 px-3 py-1.5 rounded-lg border border-slate-800">
                    <i class="fas fa-bullseye text-blue-400"></i>
                    <span class="text-slate-400">Точность:</span>
                    <span id="stat-accuracy" class="font-bold text-blue-400">0%</span>
                </div>
                <div class="flex items-center space-x-1.5 bg-slate-900/90 px-3 py-1.5 rounded-lg border border-slate-800">
                    <i class="fas fa-fire text-orange-500"></i>
                    <span id="stat-streak" class="font-bold text-orange-500">0</span>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-3xl mx-auto px-4 py-8 flex-grow w-full flex flex-col justify-center">

        <!-- Filter / Topic Selector -->
        <div class="mb-6 flex items-center justify-between gap-2 overflow-x-auto pb-2">
            <span class="text-xs text-slate-400 font-medium whitespace-nowrap">Тема:</span>
            <select id="topic-filter" onchange="changeTopicFilter()" class="bg-slate-900 text-xs text-slate-200 border border-slate-800 rounded-xl px-3 py-2 outline-none focus:border-blue-500 w-full max-w-xs">
                <option value="all">🔄 Все темы (Случайная генерация)</option>
                <option value="composition">📦 Состав систем и ППК</option>
                <option value="sensors">📡 Извещатели и Принцип Работы</option>
                <option value="ranges">📏 Дальности и Зоны обнаружения</option>
                <option value="project">📝 Проектирование (СНиП / ПУЭ)</option>
            </select>
        </div>

        <!-- Question Card -->
        <div class="custom-glass rounded-2xl p-6 md:p-8 border border-slate-800/80 shadow-2xl relative overflow-hidden">
            <!-- Decorative Accent Blur -->
            <div class="absolute -top-10 -right-10 w-32 h-32 bg-blue-500/10 rounded-full blur-2xl pointer-events-none"></div>

            <!-- Meta info bar -->
            <div class="flex justify-between items-center mb-5 border-b border-slate-800 pb-3">
                <span id="q-category" class="text-[11px] font-bold uppercase tracking-wider text-blue-400 bg-blue-500/10 px-3 py-1 rounded-md border border-blue-500/20">
                    Категория
                </span>
                <span id="q-counter" class="text-xs font-mono text-slate-400">Вопрос #1</span>
            </div>

            <!-- Question text -->
            <h2 id="q-text" class="text-lg md:text-xl font-bold text-white mb-6 leading-relaxed">
                Загрузка вопроса...
            </h2>

            <!-- Dynamic Answer Options -->
            <div id="q-options" class="space-y-3 mb-6">
                <!-- Buttons injected via JS -->
            </div>

            <!-- Explanation Feedback Box -->
            <div id="q-feedback" class="hidden p-4 rounded-xl border transition-all text-sm leading-relaxed">
                <!-- Feedback injected via JS -->
            </div>

            <!-- Action Toolbar -->
            <div class="mt-6 flex justify-between items-center pt-4 border-t border-slate-800/80">
                <button onclick="skipQuestion()" class="text-xs text-slate-500 hover:text-slate-300 transition-colors flex items-center gap-1">
                    <i class="fas fa-forward"></i> Пропустить
                </button>

                <button id="btn-next" onclick="nextQuestion()" class="hidden px-6 py-2.5 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-semibold rounded-xl text-sm transition-all shadow-lg btn-glow flex items-center gap-2">
                    <span>Следующий вопрос</span>
                    <i class="fas fa-arrow-right text-xs"></i>
                </button>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="custom-glass border-t border-slate-800/80 py-4 px-4 text-center text-xs text-slate-500">
        Бесконечный тренажер запоминания. На основе ваших учебных материалов по Охранным Системам.
    </footer>

        // Engine State
        let totalAnswered = 0;
        let totalCorrect = 0;
        let streak = 0;
        let currentQ = null;

        function getRandomQuestion() {
            const filter = document.getElementById('topic-filter').value;
            let pool = database;
            if (filter !== 'all') {
                pool = database.filter(item => item.cat === filter);
            }
            const randomIndex = Math.floor(Math.random() * pool.length);
            return pool[randomIndex];
        }

        function renderQuestion() {
            currentQ = getRandomQuestion();
            
            document.getElementById('q-category').innerText = currentQ.catName;
            document.getElementById('q-counter').innerText = `Вопрос #${totalAnswered + 1}`;
            document.getElementById('q-text').innerText = currentQ.q;

            const optionsContainer = document.getElementById('q-options');
            optionsContainer.innerHTML = '';

            // Shuffle options for training effect
            const optionsWithIndices = currentQ.options.map((opt, idx) => ({ text: opt, isCorrect: idx === currentQ.correct }));
            optionsWithIndices.sort(() => 0.5 - Math.random());

            optionsWithIndices.forEach((item, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-card w-full p-4 rounded-xl border border-slate-800 bg-slate-900/60 text-left text-slate-200 text-sm font-medium flex items-center justify-between gap-3';
                btn.innerHTML = `
                    <span class="flex items-center gap-3">
                        <span class="w-6 h-6 rounded-lg bg-slate-800 text-slate-400 text-xs flex items-center justify-center font-bold">${String.fromCharCode(65 + index)}</span>
                        <span>${item.text}</span>
                    </span>
                    <i class="far fa-circle text-slate-600 font-lg"></i>
                `;
                btn.onclick = () => checkAnswer(btn, item.isCorrect);
                optionsContainer.appendChild(btn);
            });

            // Reset Feedback & Next button
            const feedback = document.getElementById('q-feedback');
            feedback.className = 'hidden p-4 rounded-xl border text-sm leading-relaxed';
            feedback.innerHTML = '';
            document.getElementById('btn-next').classList.add('hidden');
        }

        function checkAnswer(selectedBtn, isCorrect) {
            const buttons = document.getElementById('q-options').children;
            for (let btn of buttons) {
                btn.disabled = true;
            }

            totalAnswered++;
            const feedback = document.getElementById('q-feedback');
            feedback.classList.remove('hidden');

            if (isCorrect) {
                totalCorrect++;
                streak++;
                selectedBtn.className = 'w-full p-4 rounded-xl border border-emerald-500 bg-emerald-950/40 text-left text-emerald-200 text-sm font-medium flex items-center justify-between gap-3';
                selectedBtn.querySelector('i').className = 'fas fa-check-circle text-emerald-400 text-lg';
                
                feedback.className = 'p-4 rounded-xl border border-emerald-500/40 bg-emerald-950/30 text-emerald-300 text-sm';
                feedback.innerHTML = `<p class="font-bold mb-1 flex items-center gap-2"><i class="fas fa-check"></i> Правильно!</p><p>${currentQ.exp}</p>`;
            } else {
                streak = 0;
                selectedBtn.className = 'w-full p-4 rounded-xl border border-red-500 bg-red-950/40 text-left text-red-200 text-sm font-medium flex items-center justify-between gap-3';
                selectedBtn.querySelector('i').className = 'fas fa-times-circle text-red-400 text-lg';

                feedback.className = 'p-4 rounded-xl border border-red-500/40 bg-red-950/30 text-red-300 text-sm';
                feedback.innerHTML = `<p class="font-bold mb-1 flex items-center gap-2"><i class="fas fa-times"></i> Ошибка!</p><p>${currentQ.exp}</p>`;
            }

            updateStats();
            document.getElementById('btn-next').classList.remove('hidden');
        }

        function updateStats() {
            document.getElementById('stat-correct').innerText = totalCorrect;
            const accuracy = totalAnswered > 0 ? Math.round((totalCorrect / totalAnswered) * 100) : 0;
            document.getElementById('stat-accuracy').innerText = `${accuracy}%`;
            document.getElementById('stat-streak').innerText = `🔥 ${streak}`;
        }

        function nextQuestion() {
            renderQuestion();
        }

        function skipQuestion() {
            renderQuestion();
        }

        function changeTopicFilter() {
            renderQuestion();
        }

        // Init on load
        window.onload = function() {
            renderQuestion();
        };
    </script>
</body>
</html>
